<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft To Do</title>
  <link rel="stylesheet" href="styles.css?v=20260521-scrollbar">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="user">
        <div class="avatar">L</div>
        <span class="username">Lenovo</span>
        <button class="theme-toggle" id="themeToggle" title="切换主题">
          <svg class="theme-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M1 12h2M21 12h2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
      </div>

      <div class="sync-panel">
        <div class="sync-form" id="syncForm">
          <input type="email" id="syncEmail" placeholder="邮箱">
          <input type="password" id="syncPassword" placeholder="密码">
          <div class="sync-actions">
            <button id="syncLoginBtn">登录</button>
            <button id="syncSignupBtn">注册</button>
          </div>
        </div>
        <div class="sync-user" id="syncUser" hidden>
          <div class="sync-email" id="syncUserEmail"></div>
          <div class="sync-actions">
            <button id="manualSyncBtn">同步</button>
            <button id="syncLogoutBtn">退出</button>
          </div>
        </div>
        <div class="sync-status" id="syncStatus">未登录，本地保存</div>
      </div>

      <div class="search-box">
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input type="text" id="searchInput" placeholder="搜索任务">
      </div>

      <ul class="nav">
        <li data-list-id="myday">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg></span> 我的一天
          <span class="count" id="mydayCount"></span>
        </li>
        <li data-list-id="important">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"/></svg></span> 重要
          <span class="count" id="impCount">0</span>
        </li>
        <li data-list-id="planned">
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg></span> 计划内
          <span class="count" id="plannedCount"></span>
        </li>
        <li data-list-id="tasks" class="active">
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7h8M8 12h8M8 17h5"/></svg></span> 任务
          <span class="count" id="allCount">0</span>
        </li>
      </ul>

      <div class="roadmap-label">
        路线图
        <button id="importRoadmapBtn" title="导入 Markdown 路线图">+</button>
      </div>
      <ul class="roadmap-projects" id="roadmapProjects"></ul>
      <input type="file" id="roadmapFileInput" accept=".md,text/markdown,text/plain" multiple>

      <div class="custom-lists-label">
        我的列表
        <button id="newListBtn" title="新建列表">+</button>
      </div>

      <ul class="custom-lists" id="customLists"></ul>

      <div class="new-list-row" id="newListRow">
        <input type="text" id="newListInput" placeholder="列表名称">
        <button id="createListBtn">创建</button>
      </div>
    </aside>

    <main class="main">
      <div class="hero" id="hero">
        <h1 id="listTitle">任务</h1>
        <div class="subtitle" id="dateLabel"></div>
        <button class="bg-btn" id="bgBtn" title="更换背景">🖼</button>
      </div>

      <div class="content">
        <div class="card">
          <div class="input-row">
            <span class="plus">+</span>
            <input type="text" id="input" placeholder="添加任务" autofocus>
            <button id="addBtn">添加</button>
          </div>

          <ul class="list" id="list"></ul>

          <div class="footer" id="footer" style="display:flex;">
            <span id="count"></span>
            <button id="clearDone">清除已完成的任务</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=20260521-scrollbar"></script>
</body>
</html>
